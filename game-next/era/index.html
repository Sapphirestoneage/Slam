<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find your era: SLAM the Game</title>
<meta name="description" content="Find your money era in 60 seconds. Taps only. No account.">
<meta name="theme-color" content="#04060d">
<link rel="icon" href="../icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=IM+Fell+English&family=Source+Sans+3:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gamelook.css">
<style>
/* The look is the game's own: gamelook.css is a copy of the game's style lines (colors, font, buttons, chips,
   cards, the pulse), made by tools/game_era_build.mjs. Only the layout of this one page is here. */
html,body{margin:0}
body{overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:14px}
p{margin:0}
h1{font-size:30px;line-height:1.15}
h2{font-size:20px;line-height:1.25}
.hero h1{font-size:34px}
.center{text-align:center}
.top{justify-content:space-between;min-height:44px}
.card{display:flex;flex-direction:column;gap:12px;padding:16px}
.card.lead{border:2px solid var(--a3);background:var(--hl)}
.tile{display:flex;flex-direction:column;gap:4px}
button{box-shadow:0 1px 2px rgba(0,0,0,.45)}
button:active,a.linkbtn:active{transform:translateY(1px);box-shadow:none}
a.linkbtn{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:2px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-weight:600;text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.45)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.big{min-height:56px;font-size:18px}
.chips{gap:10px}
button.i{position:relative;vertical-align:middle;box-shadow:none}
button.i::after{content:"";position:absolute;inset:-10px}
button.i[aria-expanded="true"]{background:var(--muted);color:var(--ink)}
.note{border-left:3px solid var(--a3);background:var(--panel2);border-radius:6px;padding:8px 10px;font-size:14px}
.dots,.strip{display:flex;gap:5px}
.dots i,.strip i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.dots i.done,.strip i.done{background:var(--a3)}
.dots i.on,.strip i.on{background:#fff;box-shadow:0 0 8px rgba(var(--glow),.9)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px}
@media (min-width:900px){main{padding-top:40px}}
</style>
</head>
<body data-color="midnight">
<main id="era"><noscript>This page needs JavaScript to ask its questions.</noscript></main>
<script src="../core/engine.js"></script>
<script src="../core/peers.js"></script>
<script src="../core/withdraw.js"></script>
<script src="../core/paylayers.js"></script>
<script src="gamecopy.js"></script>
<script src="../account/trust.js"></script>
<script src="../features/erain.js"></script>
<script src="era.js"></script>
<script>
/* A script that did not arrive leaves an empty page: say so, in words. */
if (typeof eraDraw !== "function" || typeof erResult !== "function")
  document.getElementById("era").textContent = "This page did not load all the way. Check your connection, then reload it.";
</script>
</body>
</html>
