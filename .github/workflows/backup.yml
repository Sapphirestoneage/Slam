# Weekly backup of the database of the game (Supabase), encrypted, kept 90 days as a workflow artifact.
# This repository is public: the dump is encrypted before it is written to a disk, and only the encrypted
# file is uploaded. Nothing is committed. How to open and restore a backup: RESTORE.md.
# The two secrets are set by the owner: SUPABASE_DB_URL and BACKUP_PASSPHRASE (RESTORE.md, Setup).
name: backup
on:
  schedule:
    - cron: '17 7 * * 0' # each Sunday, 07:17 UTC
  workflow_dispatch: # "Run workflow" on the Actions tab: a backup now
permissions:
  contents: read
concurrency:
  group: backup
  cancel-in-progress: false
env:
  PG_MAJOR: 17 # the major version of pg_dump. Keep it at or above the version of the database
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pg_dump (the PostgreSQL client of the version above)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends "postgresql-client-${PG_MAJOR}"
          echo "/usr/lib/postgresql/${PG_MAJOR}/bin" >> "$GITHUB_PATH"
      - name: Dump and encrypt (no plain copy is written)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash tools/backup.sh "$RUNNER_TEMP/backup"
      - name: Upload the encrypted file only
        uses: actions/upload-artifact@v4
        with:
          name: slam-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/backup/*.dump.gpg
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
