<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find your era: SLAM the Game</title>
<meta name="description" content="Find your money era in 60 seconds. Taps only. No account.">
<meta name="theme-color" content="#071030">
<link rel="icon" href="../icon-192.png">
<style>
/* The colors of the game (index.html, :root): dark sapphire, and nothing else. */
:root{--ink:#02061a;--panel:#071030;--panel2:#0b1a47;--line:#1d3684;--hl:#102566;--text:#f5f8ff;--muted:#8fa3e6;--gold:#eaf0ff;--teal:#2f5fee;--sap:#3f6dff;--a1:#2046d4;--a3:#7d9cff;--glow:63,109,255;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font:16px/1.45 "Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;overflow-x:hidden}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,p{margin:0}
h1{font-size:30px;line-height:1.15;text-wrap:balance}
h2{font-size:20px;line-height:1.25;text-wrap:balance}
.hero h1{font-size:34px}
.muted{color:var(--muted)}.small{font-size:14px}.tiny{font-size:12.5px}.center{text-align:center}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.glow{color:#fff;text-shadow:0 0 14px rgba(var(--glow),.85)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.lead{border:2px solid var(--a3);background:var(--hl)}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
button,a.linkbtn{font:inherit;font-weight:700;color:var(--text);background:var(--panel2);border:2px solid var(--teal);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.45)}
button:active,a.linkbtn:active{transform:translateY(1px);box-shadow:none}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:2px}
button.primary{background:var(--sap);color:#fff;border-color:var(--a3)}
button.ghost,a.linkbtn{border-color:var(--line);font-weight:600}
a.linkbtn{display:inline-flex;align-items:center;text-decoration:none}
button.wide{width:100%}
button.big{min-height:56px;font-size:18px;border-color:#fff;box-shadow:0 0 18px rgba(var(--glow),.7)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600}
.chip.on{border-color:var(--gold);background:var(--a1);color:#fff}
.ibtn{min-height:0;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--a3);background:transparent;color:var(--a3);font:italic 700 14px Georgia,serif;vertical-align:middle;position:relative;box-shadow:none}
.ibtn::after{content:"";position:absolute;inset:-10px}
.ibtn[aria-expanded="true"]{background:var(--a3);color:var(--ink)}
.note{border-left:3px solid var(--a3);background:var(--panel2);border-radius:6px;padding:8px 10px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--muted);border-radius:999px;padding:2px 4px 2px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
.dots,.strip{display:flex;gap:5px}
.dots i,.strip i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.dots i.done,.strip i.done{background:var(--a3)}
.dots i.on,.strip i.on{background:#fff;box-shadow:0 0 8px rgba(var(--glow),.9)}
details{border:1px solid var(--line);border-radius:10px;padding:0 12px}
summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
details ul{margin:0 0 12px;padding-left:20px;font-size:14px}
.foot{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px}
@media (min-width:900px){main{padding-top:48px}}
</style>
</head>
<body>
<main id="era"><noscript>This page needs JavaScript to ask its questions.</noscript></main>
<script src="../core/engine.js"></script>
<script src="gamecopy.js"></script>
<script src="../account/trust.js"></script>
<script src="../features/erain.js"></script>
<script src="era.js"></script>
<script>
/* A script that did not arrive leaves an empty page: say so, in words. */
if (typeof eraDraw !== "function" || typeof erResult !== "function")
  document.getElementById("era").textContent = "This page did not load all the way. Check your connection, then reload it.";
</script>
</body>
</html>
