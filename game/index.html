<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLAM the Game</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#071030">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cormorant+Garamond:wght@600;700&family=IM+Fell+English&family=Source+Sans+3:wght@400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* One world: dark sapphire, and nothing else. Saturated sapphire is anything you can tap. A white edge with a sapphire glow is the one thing to do next. */
  --ink:#02061a; --panel:#071030; --panel2:#0b1a47; --line:#1d3684; --hl:#102566;
  --text:#f5f8ff; --muted:#8fa3e6; --gold:#eaf0ff; --teal:#2f5fee; --sap:#3f6dff; --a1:#2046d4; --a3:#7d9cff; --n1:#14308a; --n2:#0c1d57; --glow:63,109,255; --bad:#ff7aa5; --good:#63e0c0;
  --display:"Cinzel", Georgia, serif; --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding:12px 16px 104px}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:22px} h2{font-size:18px} h3{font-size:15px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px} .gold{color:var(--gold)}
.guess{opacity:.45;font-style:italic;font-weight:600}.alloc{margin:6px 0}.allocbar{height:10px;border-radius:99px;background:repeating-linear-gradient(45deg,var(--line) 0 6px,transparent 6px 10px);border:1px solid var(--line);overflow:hidden}.allocbar i{display:block;height:100%;background:var(--sap);border-radius:99px}.allocbar i.hot{background:var(--warn)}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff}
.glow{color:#fff;text-shadow:0 0 14px rgba(var(--glow),.85)}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.lvl{border:1px solid var(--line);border-radius:8px;padding:6px 2px;text-align:center;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.lvl b{font-size:15px}
.lvl.on{background:var(--a1);border-color:var(--a3);color:#fff}
.lvl.cur{border:2px solid #fff;color:#fff}
button.rowbtn.bare{border:0;background:none;padding:0;min-height:36px}
button.rowbtn.okrow{border-color:var(--good)}
.row{display:flex;gap:8px;align-items:center} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.card.hot{border-color:var(--a3);box-shadow:0 0 0 1px rgba(var(--glow),.4)}
.card.next{border:2px solid var(--gold);background:var(--hl)}
.card.dim{border-style:dashed}
.tile{background:var(--panel2);border-radius:10px;padding:10px}
.big{font-size:22px;font-weight:700}
.bar{height:9px;background:var(--ink);border-radius:5px;overflow:hidden;border:1px solid var(--line);flex:1}
.bar>i{display:block;height:100%;background:var(--sap);transition:width .6s ease-out}
.bar.ac>i{background:var(--good)}
button{font:inherit;font-weight:700;color:var(--text);background:var(--panel2);border:2px solid var(--teal);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px}
button.primary{background:var(--sap);color:#fff;border-color:var(--a3)}
button.ghost{border-color:var(--line);font-weight:600}
/* a link that opens a different site, with the look of a button (features/firelink.js) */
a.linkbtn{display:inline-flex;align-items:center;justify-content:center;align-self:flex-start;min-height:44px;padding:8px 14px;border:2px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);font-weight:600;text-decoration:none}
a.linkbtn::after{content:"↗";margin-left:6px}
a.linkbtn:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
button.gold{border-color:var(--a3);color:var(--text)}
button.slim{min-height:36px;padding:5px 10px;font-size:14px}
button.wide{width:100%}
button.flag{align-self:center;color:var(--muted);border-style:dashed}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,g[data-a]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.i{min-height:26px;width:26px;height:26px;padding:0;border-radius:50%;border:2px solid var(--muted);color:var(--muted);background:none;font-family:Georgia,serif;font-style:italic;font-size:14px;line-height:1;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--panel2);border-radius:999px;padding:8px 14px;min-height:44px;font-weight:600}
.chip.on{border-color:var(--gold);background:var(--a1);color:#fff}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.pill.under,.pill.debuff{background:#2b1140;border-color:var(--bad);color:#ffd3e2}
.pill.surface,.pill.buff,.pill.okp{background:#0b3340;border-color:var(--good);color:#d5fbf0}
.pill.warn{background:var(--hl);border-color:var(--a3);color:var(--text)}
.pill.new{background:#fff;border-color:#fff;color:var(--ink)}
.pill.info{background:var(--hl);border-color:var(--sap);color:var(--text)}
.cond{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.stat{display:grid;grid-template-columns:130px 1fr 26px;gap:8px;align-items:center;font-size:14px}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel)}
summary{cursor:pointer;padding:12px;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
summary::-webkit-details-marker{display:none}
summary::after{content:"Show";font-size:12.5px;color:var(--a3);border:1px solid var(--sap);border-radius:6px;padding:2px 8px;flex:none}
details[open] summary::after{content:"Hide"}
details>.inner{padding:0 12px 12px}
.spine{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
button.era{flex:0 0 116px;text-align:left;border:2px solid var(--line);border-radius:10px;padding:8px;background:var(--panel2);font-size:14px;font-weight:400}
.era.done{border-color:var(--good)} .era.cur{border-color:#fff;background:var(--n1)} .era.fog{border-style:dashed;color:var(--muted)}
button.node,button.rowbtn{width:100%;text-align:left;border:2px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px;font-weight:600}
button.rowbtn{display:flex;align-items:center;justify-content:space-between;gap:10px}
.node.done{border-color:var(--good)} .node.part{border-color:#fff;background:var(--n1)} .node.faded{border-style:dashed;color:var(--muted)}
.rowbtn.sel{border-color:#fff;background:var(--a1)} .rowbtn.locked{border-style:dashed} .rowbtn.planted{border-color:var(--teal)}
.caret{color:var(--a3);font-size:20px;font-weight:700;line-height:1}
button.linkish{border:0;background:none;padding:4px 0;min-height:36px;text-align:left;text-decoration:underline;text-decoration-color:var(--teal);text-underline-offset:3px}
.pips{display:flex;gap:4px;margin-top:6px} .pips i{width:18px;height:6px;border-radius:3px;background:var(--ink);border:1px solid var(--line)} .pips i.on{background:var(--sap);border-color:var(--a3)}
.tier{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.hats{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg button{border:0;border-radius:0;min-height:36px;padding:4px 12px;font-size:14px;background:none;color:var(--muted)}
.seg button.on{background:var(--a1);color:#fff}
.crumbs{gap:6px}
.pathrow{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px}
.pathrow:first-child{border-top:0;padding-top:0}
.num{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-weight:700}
.pathrow:first-child .num{border-color:#fff;background:var(--a1);color:#fff}
.numrow{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--panel2)}
.numopen{border:2px solid var(--a3);border-radius:10px;padding:10px;background:var(--panel2)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad .key{min-height:52px;font-size:20px;border-color:var(--line);background:var(--panel)}
svg.orbit{width:100%;max-width:420px;height:auto;display:block;margin:0 auto}
.orbit .ring{fill:none;stroke:var(--line);stroke-dasharray:4 5}
.orbit text{fill:var(--text);font-size:11px;font-weight:600;text-anchor:middle;dominant-baseline:central;font-family:var(--body);pointer-events:none}
.orbit text.sub{fill:var(--a3);font-weight:700}
.orbit .sun circle{fill:var(--hl);stroke:var(--gold);stroke-width:2}
.orbit .sun text{font-size:12px}
.orbit .pl{cursor:pointer}
.orbit .pl circle{fill:var(--panel2);stroke:var(--teal);stroke-width:2}
.orbit .pl.locked circle{stroke:var(--muted);stroke-dasharray:4 4}
.orbit .pl.planted circle{fill:var(--a1)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--ink);border-top:1px solid var(--line);display:flex;justify-content:center}
nav.tabs .in{display:grid;grid-template-columns:1fr 1fr auto 1.15fr 1fr 0.8fr;align-items:center;max-width:520px;width:100%}
nav.tabs button{position:relative;border:0;border-radius:0;background:none;color:var(--muted);font-size:14px;padding:10px 2px 14px;min-height:56px}
nav.tabs button.on{color:#fff;box-shadow:inset 0 3px 0 var(--sap)}
.dot{position:absolute;top:8px;right:22%;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px var(--sap)}
.overlay{position:fixed;inset:0;background:#000000d9;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;max-width:520px;width:100%;max-height:94%;overflow:auto;padding:16px 16px 24px}
.levelup{text-align:center;border:2px solid var(--sap);border-radius:16px;padding:20px;background:var(--hl)}
.levelup .medal{width:80px;height:80px;margin:8px auto;border-radius:50%;border:3px solid #fff;background:var(--a1);box-shadow:0 0 24px 4px rgba(var(--glow),.55);display:flex;align-items:center;justify-content:center;font-family:var(--body);font-weight:700;font-size:22px;color:#fff}
input[type=text],textarea{font:inherit;color:var(--text);background:var(--ink);border:2px solid var(--muted);border-radius:10px;padding:10px;width:100%}
textarea{font-size:12.5px;font-family:ui-monospace,Menlo,monospace}
.field{display:flex;flex-direction:column;gap:6px}
.field .val{font-size:26px;font-weight:700;color:#fff}
.banner{border-left:4px solid var(--sap);border-radius:0 8px 8px 0;padding:8px 10px;background:var(--hl)}
.err{color:#ffd3e2;font-size:14px;font-weight:600}
.qr{background:#fff;padding:10px;border-radius:10px;max-width:240px;margin:0 auto}
.qr svg{display:block;width:100%;height:auto}
/* jobs.js */
.jbrun .dkprog i{background:var(--sap)}.jbrole .dkprog{width:100%}
@media (prefers-reduced-motion:no-preference){
 .pulse,button.go{animation:pulse 1.6s ease-in-out infinite}
 @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(var(--glow),0),0 0 10px 0 rgba(var(--glow),.35)}50%{box-shadow:0 0 0 7px rgba(var(--glow),.35),0 0 26px 6px rgba(var(--glow),.65)}}
 .flash{animation:flash 1.4s ease-out}@keyframes flash{0%{color:#fff;text-shadow:0 0 16px var(--a3),0 0 4px #fff;transform:scale(1.18)}100%{text-shadow:none;transform:none}}
 .flash{display:inline-block}
 .jbmoved{animation:jbin .6s ease-out}@keyframes jbin{from{transform:translateY(-8px);opacity:.2}to{transform:none;opacity:1}}
 .pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:none;opacity:1}}
}

/* looks: same game, different world */
body[data-look="fae"]{--ink:#0c0418;--panel:#190a2d;--panel2:#25103f;--line:#4b2a7a;--hl:#33175a;--text:#fbf6ff;--muted:#b9a3e0;--gold:#f6ecff;--teal:#8a4fd6;--sap:#b06cff;--a1:#7a3fd0;--a3:#d9b8ff;--n1:#4b1f8c;--n2:#250f4c;--glow:176,108,255;--good:#7fe0c0;--bad:#ff8ab8;--display:"Cormorant Garamond",Georgia,serif}
body[data-look="coven"]{--ink:#090305;--panel:#16070c;--panel2:#230b13;--line:#5c1628;--hl:#3a0e1a;--text:#fff5f6;--muted:#c99aa6;--gold:#ffeef0;--teal:#a31d3a;--sap:#d42a4e;--a1:#a01a38;--a3:#ff9bb0;--n1:#5e1024;--n2:#28070f;--glow:212,42,78;--good:#9fd8c0;--bad:#ffb3c0;--display:"Cormorant Garamond",Georgia,serif}
body[data-look="tabletop"]{--ink:#06100b;--panel:#0d1e16;--panel2:#132e23;--line:#2c5a45;--hl:#1a3d2e;--text:#f6f1e1;--muted:#a9c2b2;--gold:#f6f1e1;--teal:#2f8a62;--sap:#3fb37f;--a1:#1f7a54;--a3:#9be5c0;--n1:#1e5a42;--n2:#0e2a1f;--glow:63,179,127;--good:#9be5c0;--bad:#ff9a9a;--display:"IM Fell English",Georgia,serif}
body[data-look="north"]{--ink:#070b0f;--panel:#101921;--panel2:#172532;--line:#34516b;--hl:#1f3447;--text:#f1f6fa;--muted:#9fb4c6;--gold:#f1f6fa;--teal:#2c6787;--sap:#2f7fa6;--a1:#1d5676;--a3:#9cc8dd;--n1:#1c455e;--n2:#0e2230;--glow:47,127,166;--good:#8fe0c4;--bad:#ff9aa8}
/* the Rings: its look wins over the default color (midnight); a color the player picked still wins over it */
body[data-look="rings"]{--ink:#0d0806;--panel:#1a100b;--panel2:#24170f;--line:#4a2e1e;--hl:#33201a;--text:#fbf1e8;--muted:#c9a892;--gold:#ffe9d2;--teal:#9a4a1a;--sap:#b9581e;--a1:#9a4a1a;--a3:#ffb98a;--n1:#5a3018;--n2:#1c0f0a;--glow:185,88,30;--good:#8fdcc0;--bad:#ffb648}
body[data-look="rings"][data-color="midnight"]{--ink:#0d0806;--panel:#1a100b;--panel2:#24170f;--line:#4a2e1e;--hl:#33201a;--text:#fbf1e8;--muted:#c9a892;--gold:#ffe9d2;--teal:#9a4a1a;--sap:#b9581e;--a1:#9a4a1a;--a3:#ffb98a;--n1:#5a3018;--n2:#1c0f0a;--glow:185,88,30;--good:#8fdcc0;--bad:#ffb648}
body[data-look="fae"] h1,body[data-look="fae"] h2,body[data-look="coven"] h1,body[data-look="coven"] h2{font-size:1.25em}
.field.miss{border:2px solid var(--bad);border-radius:12px;padding:10px;animation:pulse 1.6s infinite}
.pathrow button.linkish{min-height:0;padding:0;font:inherit;color:var(--text)}
nav.tabs button.logtab{flex:none;align-self:center;min-height:40px;padding:6px 12px;margin:0 2px;border-radius:999px;border:2px solid #fff;background:var(--sap);color:#fff;font-weight:700;font-size:14px}
nav.tabs{flex-wrap:nowrap}
nav.tabs button{font-size:13.5px;flex:1 1 0;min-width:0;width:auto;max-width:none;white-space:nowrap}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 8px;background:var(--ink)}
.swatch{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid #fff}

/* v13: time is the currency */
.topbar .grp{display:flex;gap:8px}
button.safebtn{border-color:var(--a3);color:var(--text);font-weight:700}
details.math{border-style:dashed;background:none}
details.math summary{padding:8px 10px;font-size:13px;font-weight:600;color:var(--muted)}
details.math summary::after{content:"Show"}details.math[open] summary::after{content:"Hide"}
.lamp{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}
.lamp.green{background:#35d07f;box-shadow:0 0 12px #35d07f}.lamp.yellow{background:var(--a3);box-shadow:0 0 12px var(--a3)}.lamp.red{background:#fff;box-shadow:0 0 12px #fff}
.verdict{border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--panel2)}
.verdict.green{border-color:#35d07f}.verdict.yellow{border-color:var(--a3)}.verdict.red{border-color:#fff}
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.pickbig{min-height:170px;border:2px solid var(--a3);border-radius:16px;background:var(--hl);padding:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:var(--text);box-shadow:0 0 14px rgba(var(--glow),.35)}
.sharecard{padding:28px 18px}
.good{color:var(--good)}.bad{color:var(--bad)}
.sheet>*{flex-shrink:0}
.rside{text-align:right;flex:none;max-width:46%}

/* games */
.fogstrip{display:flex;gap:3px;width:100%;padding:8px;border:2px solid var(--line);border-radius:10px;background:var(--ink);margin-top:6px}
.fogstrip i{flex:1;height:14px;border-radius:3px;background:var(--n2);opacity:.55}
.fogstrip i.on{background:var(--a3);opacity:1;box-shadow:0 0 6px rgba(var(--glow),.7)}
.bons{display:inline-flex;gap:5px}.bons i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:inline-block}
.bons i.lit{background:var(--text);border-color:var(--text);box-shadow:0 0 8px var(--text)}
.fogmap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button.fogt{min-height:76px;border:2px dashed var(--line);border-radius:12px;background:repeating-linear-gradient(135deg,var(--ink),var(--ink) 6px,var(--n2) 6px,var(--n2) 12px);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;font-size:12px;text-align:center}
button.fogt span{font-size:18px;font-weight:800}
button.fogt.on{border-style:solid;border-color:var(--a3);background:var(--panel2);color:var(--text);opacity:1}
button.fogt:not(.on):not([disabled]){box-shadow:0 0 10px rgba(var(--glow),.35)}
.geargrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.slot{min-height:74px;border-radius:12px;padding:8px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:4px;border:2px solid var(--line);background:var(--panel2);color:var(--text)}
button.slot span{font-size:12px;color:var(--muted)}
button.slot.have{border-color:var(--a3);background:var(--hl);box-shadow:0 0 10px rgba(var(--glow),.4)}
button.slot.have span{color:var(--text)}
button.slot.none{border-style:dashed;background:none}
button.slot.unsure{border-style:dotted;opacity:.85}
button.slot.unk{border-color:var(--a3);animation:glow 1.6s ease-in-out infinite}
.hl3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button.pickbig.sm{min-height:88px}
.dots{letter-spacing:3px;font-size:16px}

.typ{opacity:.55;font-style:italic}.bignum{font-size:28px;font-weight:800;line-height:1.2;text-align:center}
.tiergrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.tierb{min-height:64px;border-radius:12px;border:2px solid var(--a3);background:var(--hl);color:var(--text);display:flex;align-items:center;gap:10px;padding:8px 12px;text-align:left}
button.tierb b,.tierrow>b{font-size:20px;font-weight:900;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--a3);background:var(--n1);color:var(--text)}
button.tierb span{font-size:13px}
button.tierb.tS b,.tierrow>b.tS{background:var(--sap);color:#fff}button.tierb.tA b,.tierrow>b.tA{background:var(--a1);color:#fff}button.tierb.tD b,button.tierb.tF b,.tierrow>b.tD,.tierrow>b.tF{background:var(--ink);color:var(--muted)}
.tierrow{display:flex;gap:8px;align-items:center;min-height:38px}.tierrow>div{display:flex;flex-wrap:wrap;gap:4px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
